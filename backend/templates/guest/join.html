{% extends "shared/base.html" %}

{% block title %}
<title>Join {{ owner_nick }}'s Game</title>
{% endblock %}

{% block page_heading %}Join {{ owner_nick }}'s Game{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <p class="text-secondary text-center mb-4">
                    You are invited to join a game hosted by <strong>{{ owner_nick }}</strong>.
                    <br>Please enter a nickname to continue.
                </p>

                <form method="POST" action="/guest/join">
                    <input type="hidden" name="token" value="{{ token }}">

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="nick" name="nick" placeholder="Nickname" required
                            autofocus>
                        <label for="nick">Your Nickname</label>
                    </div>

                    <!-- Spacer to prevent content from hiding behind fixed bottom nav -->
                    <div style="height: 100px;"></div>

                    <!-- Fixed Bottom Navigation -->
                    <div class="fixed-bottom bg-white border-top pb-3 pt-2 px-3 shadow" style="z-index: 1030;">
                        <div class="d-flex gap-3 justify-content-center mx-auto" style="max-width: 800px;">
                            <a href="/"
                                class="btn btn-light shadow-sm d-flex flex-column align-items-center justify-content-center flex-grow-1 border"
                                style="padding-top: 0.6rem; padding-bottom: 0.6rem; border-radius: 12px;">
                                <i class="bi bi-arrow-left mb-1 fs-4 text-secondary"></i>
                                <span class="small fw-bold text-secondary" style="font-size: 0.8rem;">Back</span>
                            </a>
                            <button type="submit"
                                class="btn btn-primary d-flex flex-column align-items-center justify-content-center flex-grow-1 border-0 shadow"
                                style="padding-top: 0.6rem; padding-bottom: 0.6rem; border-radius: 12px; background: linear-gradient(135deg, #0d6efd, #0a58ca);">
                                <i class="bi bi-check-circle-fill mb-1 fs-4 text-white"></i>
                                <span class="small fw-bold text-white" style="font-size: 0.8rem;">Join Game</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
