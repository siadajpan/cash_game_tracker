<script>
    if (typeof confirmPlayerRemoval !== 'function') {
        function confirmPlayerRemoval(event, nick) {
            event.preventDefault();
            Swal.fire({
                title: 'Are you sure?',
                text: `You are about to remove ${nick} from the game. All their buy-ins and add-ons for this game will be deleted!`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: '<i class="bi bi-person-dash text-white"></i><span class="text-white">Remove</span>',
                cancelButtonText: '<i class="bi bi-x-circle text-secondary"></i><span class="text-secondary">Cancel</span>',
                reverseButtons: true,
                buttonsStyling: false,
                customClass: {
                    confirmButton: 'btn btn-premium-base btn-premium-danger flex-grow-1',
                    cancelButton: 'btn btn-premium-base btn-premium-secondary flex-grow-1',
                    actions: 'd-flex gap-3 w-100 px-4 pb-2',
                    popup: 'rounded-4 border-0 shadow-lg'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    event.detail.issueRequest();
                }
            });
        }
    }
</script>

{% if players %}
<ul class="list-group list-group-flush">
    {% for player in players %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <span>{{ player.nick }}</span>
        <button class="btn btn-sm btn-outline-danger" hx-delete="/game/{{ game.id }}/remove_player/{{ player.id }}"
            hx-swap="none" hx-on:htmx:confirm="confirmPlayerRemoval(event, '{{ player.nick | replace("'", "\\'") }}')">
            Remove
        </button>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="text-center text-muted m-3">No other players in the game.</p>
{% endif %}
