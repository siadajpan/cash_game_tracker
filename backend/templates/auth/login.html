{% extends "shared/base.html" %} {% block title %}
<title>Login</title>
{% endblock %} {% block page_heading %}Login{% endblock %} {% block content %}


<div class="mb-3">
  <form method="POST">
    <div class="form-floating mb-3">
      <input type="text" class="form-control" name="nick" placeholder="Nick" value="{{ form.nick }}" />
      <label>Nick</label>
    </div>
    <div class="form-floating mb-3">
      <input type="password" required placeholder="Your password" value="{{ form.password }}" name="password"
        class="form-control" />
      <label>Password</label>

      <div class="mt-2 d-flex justify-content-between">
        <a href="/forgot-password" class="small text-muted">Forgot password?</a>
        <a href="/forgot-nick-id/" class="small text-primary fw-bold">Don't know your ID?</a>
      </div>
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const lastId = localStorage.getItem('last_nick_id');
    if (lastId) {
      const input = document.querySelector('input[name="nick"]');
      if (input && !input.value) {
        input.value = lastId;
      }
    }
  });
</script>

<!-- Button row -->
<div class="d-flex gap-3 justify-content-center mt-4">
  <a href="/welcome"
    class="btn btn-light shadow-sm d-flex flex-column align-items-center justify-content-center flex-grow-1 border"
    style="padding-top: 0.8rem; padding-bottom: 0.8rem; border-radius: 12px;">
    <i class="bi bi-person-plus mb-1 fs-4 text-secondary"></i>
    <span class="small fw-bold text-secondary" style="font-size: 0.9rem;">Create Account</span>
  </a>
  <button type="submit"
    class="btn btn-primary d-flex flex-column align-items-center justify-content-center flex-grow-1 border-0 shadow"
    style="padding-top: 0.8rem; padding-bottom: 0.8rem; border-radius: 12px; background: linear-gradient(135deg, #0d6efd, #0a58ca);">
    <i class="bi bi-box-arrow-in-right mb-1 fs-4 text-white"></i>
    <span class="small fw-bold text-white" style="font-size: 0.9rem;">Login</span>
  </button>
</div>
</form>
</div>
{% endblock %}
