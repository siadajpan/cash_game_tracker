{% extends "shared/base.html" %}
{% block title %}
<title>Forgot Password</title>
{% endblock %}
{% block page_heading %}Forgot Password{% endblock %}
{% block content %}

{% if message %}
<div class="alert alert-success" role="alert">
  {{ message }}
</div>
{% endif %}

<form method="POST" id="forgotPasswordForm">
  <div class="form-floating mb-3">
    <input type="email" required placeholder="Enter your email" name="email" value="{{email}}" class="form-control" />
    <label>Email address</label>
    <div class="form-text">We'll send you a link to reset your password.</div>
  </div>

</form>

<!-- Spacer to prevent content from hiding behind fixed bottom nav -->
<div style="height: 120px;"></div>

<!-- Fixed Bottom Navigation -->
<div class="fixed-bottom bg-white border-top pb-3 pt-2 px-3 shadow" style="z-index: 1030;">
  <div class="d-flex gap-3 justify-content-center mx-auto" style="max-width: 800px;">
    <a href="/login" class="btn btn-premium-base btn-premium-secondary">
      <i class="bi bi-arrow-left"></i>
      <span>Back</span>
    </a>
    <button type="submit" form="forgotPasswordForm" class="btn btn-premium-base btn-premium-primary">
      <i class="bi bi-envelope text-white"></i>
      <span class="text-white">Send Link</span>
    </button>
  </div>
</div>
{% endblock %}
